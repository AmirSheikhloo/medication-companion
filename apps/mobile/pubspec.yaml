name: medication_companion
description: "Private offline Persian medication companion beta."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_local_notifications: 23.0.2
  flutter_timezone: 5.1.1
  timezone: 0.11.2
  pdf: 3.13.1
  printing: 5.15.1
  share_plus: 13.3.1
  image_picker: 1.2.4
  path_provider: 2.1.6
  # Local offline persistence for beta.
  drift: 2.35.4
  drift_flutter: 0.3.1
  # Android API 37: avoid the deprecated registrar reference crash at startup.
  path_provider_android: 2.2.23
  # M4-01C: pinned FFI SQLite engine for fail-closed, read-only backup inspection.
  sqlite3: 3.9.1
  ffi: 2.2.0
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: ^2.10.4
  drift_dev: 2.35.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/NotoSansArabic-Bold.ttf
    - assets/images/welcome_ribbon_capsule.png
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700

# sqlite3's downloadable Android binary is built with SQLITE_OMIT_AUTHORIZATION
# and cannot safely inspect untrusted restore candidates. For Android we build
# an amalgamation pinned in the public rusqlite submodule *without* that flag.
# The authorizer and all database operations MUST use this one SQLite binary.
# Linux CI still uses system SQLite (with its authorizer compiled in).
hooks:
  user_defines:
    sqlite3:
      source:
        linux: system
        android: source
        default: sqlite3
      path: third_party/rusqlite/libsqlite3-sys/sqlite3/sqlite3.c
      defines:
        default_options: false
        defines:
          - SQLITE_THREADSAFE=1
          - SQLITE_DQS=0
          - SQLITE_DEFAULT_MEMSTATUS=0
          - SQLITE_TEMP_STORE=2
          - SQLITE_ENABLE_FTS5
          - SQLITE_ENABLE_RTREE
          - SQLITE_ENABLE_MATH_FUNCTIONS
