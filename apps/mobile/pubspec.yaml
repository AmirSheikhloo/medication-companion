name: medication_companion
description: "M0 Android alarms and offline Persian PDF engineering spike."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_local_notifications: 23.0.2
  flutter_timezone: 5.1.1
  timezone: 0.11.2
  pdf: 3.13.1
  printing: 5.15.1
  share_plus: 13.3.1
  # M1 offline persistence (the M0 UI remains unchanged in this PR).
  drift: 2.35.4
  drift_flutter: 0.3.1
  # M4-01C: pinned FFI SQLite engine for fail-closed, read-only backup inspection.
  sqlite3: 3.9.1
  ffi: 2.2.0
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: ^2.10.4
  drift_dev: 2.35.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/NotoSansArabic-Bold.ttf

# Linux native-assets builds strip sqlite3 symbols not named in upstream's
# generated FFI bindings. The authorizer is deliberately not in that list.
# Use the system SQLite on CI Linux so tests exercise the REAL authorizer;
# mobile platforms keep the bundled native SQLite engine. The Android symbol
# still requires device validation before release.
hooks:
  user_defines:
    sqlite3:
      source:
        linux: system
        default: sqlite3
