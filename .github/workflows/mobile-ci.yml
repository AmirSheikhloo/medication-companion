name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
      - '.github/scripts/Install_Medication_Companion_CI_Preview.ps1'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
      - '.github/scripts/Install_Medication_Companion_CI_Preview.ps1'

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Flutter analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Flutter 3.50
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify Android startup plugin pin
        run: |
          flutter pub deps --json > /tmp/medication-beta-deps.json
          python3 - <<'PY'
          import json
          with open('/tmp/medication-beta-deps.json', encoding='utf-8') as handle:
              packages = json.load(handle)['packages']
          version = next((p['version'] for p in packages if p['name'] == 'path_provider_android'), None)
          assert version == '2.2.23', f'Android API 37 startup dependency mismatch: {version}'
          print('Android startup plugin version pinned:', version)
          PY

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Static analysis
        run: flutter analyze

      - name: Widget and unit tests
        run: flutter test --reporter expanded

      - name: Upload rendered UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medication-companion-ui-review
          path: apps/mobile/build/ui-previews/*.png
          retention-days: 7
          if-no-files-found: warn

      - name: Test preview installer safety rules
        run: pwsh -NoProfile -File ../../.github/scripts/Install_Medication_Companion_CI_Preview.ps1 -SelfTest

      - name: Build Android beta preview APK
        run: flutter build apk --debug --dart-define=MVP_BETA=true --dart-define=BETA_RUN_NUMBER=${{ github.run_number }}

      - name: Assert Android SQLite authorizer exports
        run: python3 ../../.github/scripts/assert_android_sqlite_authorizer.py build/app/outputs/flutter-apk/app-debug.apk

      - name: Bundle self-cleaning beta installer
        run: cp ../../.github/scripts/Install_Medication_Companion_CI_Preview.ps1 build/app/outputs/flutter-apk/Install_Medication_Companion_CI_Preview.ps1

      - name: Upload Android beta preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: medication-companion-beta-android-debug
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
            apps/mobile/build/app/outputs/flutter-apk/Install_Medication_Companion_CI_Preview.ps1
          retention-days: 7
          if-no-files-found: error
